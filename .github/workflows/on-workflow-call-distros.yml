on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    name: macos install/uninstall

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: base runner
        uses: ./.github/actions/base-runner

      - name: install
        run: bash ./scripts/install

      - name: verify install
        run: |
          set -euo pipefail
          asryx_bin="${HOME}/.local/bin/asryx"
          test -x "${asryx_bin}"
          "${asryx_bin}" status | grep -qx 'idle'
          "${asryx_bin}" --model list >/dev/null

      - name: uninstall
        run: bash ./scripts/uninstall

      - name: verify uninstall
        run: |
          set -euo pipefail
          test ! -e "${HOME}/.local/bin/asryx"
